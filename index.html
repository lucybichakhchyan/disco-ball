<!DOCTYPE html>
<html lang="en" class="disco-space">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let’s party, by Lucy Bichakhchyan</title>
  <meta name="description" content="A side project by Lucy Bichakhchyan: a 3D mirror ball that hangs over the page, dances to the music and throws light across the words.">

  <meta property="og:title" content="Let’s party, by Lucy Bichakhchyan">
  <meta property="og:description" content="A side project by Lucy Bichakhchyan: a 3D mirror ball that hangs over the page, dances to the music and throws light across the words.">

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@118,700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Lucy Bichakhchyan brand system: Archivo set wide for the words, Geist for the small text,
       ink, bone and lilac, and emphasis by light ("dim, then bright") */
    :root {
      color-scheme: dark;
      --color-bg: #131114;                             /* ink */
      --text: #F6F6F4;                                 /* bone */
      --muted: #A8A3AE;
      --dim: rgba(246, 246, 244, 0.46);
      --line: rgba(246, 246, 244, 0.28);
      --accent: #8A2BE2;
      --focus: #A762E7;
      --shine: #BFA6F2;                                /* lilac */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);      /* long, soft landing */
      --reveal: 1100ms;                                /* each letter's entrance */
      --stagger: 55ms;                                 /* gap between letters */
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--color-bg);
      color: var(--text);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 72px 16px 96px;
      transition: padding-top 700ms var(--ease-out);
      overflow: hidden;
    }
    /* the words sit a little low, leaving room for the ball to hang above them;
       if the ball can't load, the space is given back and the words centre */
    html.disco-space body { padding-top: clamp(96px, 26vh, 260px); }
    ::selection { background: var(--accent); color: #fff; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- The words ---------- */
    .party { position: relative; z-index: 1; }
    h1 {
      margin: 0;
      font-family: 'Archivo', 'Arial Narrow', Arial, sans-serif;
      font-stretch: 118%;
      font-weight: 700;
      font-size: clamp(2.5rem, min(12.2vw, 30vh), 11rem);   /* Archivo set wide runs about a quarter wider */
      line-height: 1;
      letter-spacing: -0.03em;
      text-align: center;
      white-space: nowrap;
      /* one quiet, steady glow; the light from the ball does the rest */
      filter: drop-shadow(0 0 18px rgba(191, 166, 242, 0.2));
    }
    h1 em { font-style: normal; }
    .word { display: inline-block; }
    /* dim, then bright: the lead-in steps back and the word that matters is lit.
       With the music on, "party!" flares on every beat and "Let's" lifts at the start of each bar. */
    .word.dim { color: rgba(246, 246, 244, calc(0.42 + var(--lift, 0) * 0.3)); }
    .word.bright { color: var(--text);
      text-shadow: 0 0 calc(var(--hit, 0) * 0.34em) rgba(191, 166, 242, calc(var(--hit, 0) * 0.85)), 0 0 calc(var(--hit, 0) * 0.08em) rgba(255, 255, 255, calc(var(--hit, 0) * 0.9)); }
    .gap { display: inline-block; width: 0.28em; }
    .l {
      position: relative;
      display: inline-block;
      animation: rise var(--reveal) var(--ease-out) both;
      animation-delay: calc(var(--i) * var(--stagger));
    }
    /* letters wait until the typeface has loaded, so it never swaps mid-entrance */
    .party:not(.ready) .l { animation-play-state: paused; }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0.35em); filter: blur(10px); }
      100% { opacity: 1; transform: none; filter: blur(0); }
    }

    /* When the ball's light lands on a letter, the letter catches it:
       it flashes a touch brighter and a soft bloom opens behind it
       (a white core, with the lilac only in the halo). */
    .l::before,
    .l::after {
      content: attr(data-ch);
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    .l::before {
      color: transparent;
      text-shadow: 0 0 0.06em rgba(255, 255, 255, 0.9), 0 0 0.32em var(--glow, rgba(191, 166, 242, 0.55));
      z-index: -1;
    }
    .l::after {
      color: #FFFFFF;
      text-shadow: 0 0 0.02em #FFFFFF;
    }
    .l.glint::before { animation: flare 1100ms var(--ease-out); }
    .l.glint::after  { animation: flash 700ms var(--ease-out); }
    @keyframes flare {
      0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; }
    }
    @keyframes flash {
      0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; }
    }

    /* ---------- Sparkles: the brand sparkle pops beside a letter as it catches the light ---------- */
    .sp {
      position: absolute;
      width: var(--s, 20px); height: var(--s, 20px);
      margin: calc(var(--s, 20px) / -2) 0 0 calc(var(--s, 20px) / -2);
      fill: var(--c, #F6F6F4);
      pointer-events: none;
      opacity: 0;
      animation: twinkle 1100ms var(--ease-out) var(--delay, 0ms) 1 both;
    }
    @keyframes twinkle {
      0%   { opacity: 0; transform: scale(0) rotate(0deg); }
      35%  { opacity: 1; transform: scale(1) rotate(22deg); }
      100% { opacity: 0; transform: scale(0.4) rotate(45deg); }
    }

    /* ---------- Footer: the music on the left, the links on the right ---------- */
    .foot {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 20px;
      padding: 12px 16px;
      z-index: 10000;                                  /* above the light spots */
      font-size: 14px;
    }
    .deckbar, .links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
    .links { margin-left: auto; }

    /* the Play button is a glass pill: a clear lens with a bright rim that fills with lilac light when the music is on */
    .music {
      display: inline-flex; align-items: center; gap: 10px;
      min-height: 44px; padding: 0 20px 0 16px;
      color: var(--text); font: 500 14px/1 'Geist', system-ui, sans-serif;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(191, 166, 242, 0.05) 55%, rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -8px 14px rgba(138, 43, 226, 0.14), 0 0 0 rgba(138, 43, 226, 0);
      -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4);
      cursor: pointer;
      transition: box-shadow 220ms var(--ease-out), border-color 220ms var(--ease-out), transform 120ms var(--ease-out);
    }
    .music:hover { border-color: rgba(255, 255, 255, 0.55); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -8px 14px rgba(138, 43, 226, 0.22), 0 0 26px rgba(138, 43, 226, 0.6); }
    .music:active { transform: scale(0.97); }
    .music[data-state="on"] { border-color: rgba(221, 208, 249, 0.8);
      background: linear-gradient(180deg, rgba(221, 208, 249, 0.34), rgba(138, 43, 226, 0.3) 60%, rgba(191, 166, 242, 0.3));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 0 calc(14px + var(--pulse, 0) * 22px) rgba(138, 43, 226, 0.7); }
    /* three equaliser bars: still when off, dancing on the beat when on */
    .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .eq i { display: block; width: 2px; height: 100%; background: currentColor; border-radius: 1px; transform-origin: 50% 100%; }
    .eq i:nth-child(1) { transform: scaleY(0.45); }
    .eq i:nth-child(2) { transform: scaleY(0.9); }
    .eq i:nth-child(3) { transform: scaleY(0.6); }
    .music[data-state="on"] .eq i { animation: eq 500ms ease-in-out infinite alternate; }
    .music[data-state="on"] .eq i:nth-child(2) { animation-delay: -250ms; }
    .music[data-state="on"] .eq i:nth-child(3) { animation-delay: -125ms; }
    @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }

    /* the moods are words: the one that is playing is bright and the others are dim */
    .moods { display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px; }
    .mood { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
      color: var(--dim); font: 500 14px/1 'Geist', system-ui, sans-serif; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 180ms var(--ease-out); }
    .mood:hover { color: rgba(246, 246, 244, 0.82); }
    .mood[aria-pressed="true"], html.is-dropping .mood--file { color: var(--text); }
    .mood--file:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }

    .credit {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 44px;
      color: var(--muted); font-weight: 500;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 4px;
      transition: color 160ms var(--ease-out), text-decoration-color 160ms var(--ease-out);
    }
    .credit:hover, .credit:focus-visible { color: var(--text); text-decoration-color: var(--focus); }
    .credit .bling { width: 14px; height: 14px; fill: var(--shine); margin: -8px 0 0 -3px; }   /* the sign-off, on the last letter */
    .k-short { display: none; }

    /* ---------- Party mode (music on): the room pulses with the sound ---------- */
    .room-wrap {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 800ms var(--ease-out);
    }
    html.is-partying .room-wrap { opacity: 1; }
    .room {
      position: absolute; inset: 0;
      background: var(--room, #6B2BD9);
      opacity: calc(0.05 + var(--pulse, 0) * 0.13);
      transition: background-color 600ms var(--ease-out);
    }

    /* ---------- Tall screens (phones held upright): two lines, much bigger ---------- */
    @media (max-aspect-ratio: 17/20) {
      h1 { white-space: normal; font-size: clamp(2.5rem, 20.5vw, 11rem); line-height: 0.98; }
      .gap { display: block; height: 0; }
      .foot { justify-content: center; }
      .links { margin-left: 0; justify-content: center; }
      .deckbar { justify-content: center; }
    }
    @media (max-width: 400px) {
      .k-long { display: none; }
      .k-short { display: inline; }
    }

    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; }
      .l.glint::before, .l.glint::after { animation: none; }
      .sp { display: none; }
      .music[data-state="on"] .eq i { animation: none; }
      .music, .mood, .credit { transition: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var root = document.documentElement;
      var party = document.getElementById('party');
      var h1 = party.querySelector('h1');
      var letters = Array.prototype.slice.call(document.querySelectorAll('.l'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var REVEAL = 1100, STAGGER = 55;

      // ---------- The tab icon: the glowing sparkle on an ink tile, built from the one drawing on the page ----------
      (function () {
        var d = document.getElementById('blingPath').getAttribute('d');
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset="0.22" stop-color="#fff"/><stop offset="1" stop-color="#BFA6F2"/></radialGradient></defs><rect width="100" height="100" rx="18" fill="#131114"/><path fill="url(#g)" d="' + d + '"/></svg>';
        document.getElementById('tabIcon').setAttribute('href', 'data:image/svg+xml,' + encodeURIComponent(svg));
      })();

      // ---------- Start the entrance once the typeface is ready (1.2 s at most) ----------
      var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1200); })]).then(function () {
        party.classList.add('ready');
        // cue the disco ball to drop in as the last letter settles
        setTimeout(function () {
          window.__discoCue = true;
          window.dispatchEvent(new Event('disco:cue'));
        }, reduce.matches ? 0 : REVEAL * 0.55 + STAGGER * letters.length);
      });

      // ---------- Letters catch the ball's light ----------
      var rects = [];
      function measure() {
        rects = letters.map(function (l) {
          var r = l.getBoundingClientRect();
          var padX = r.width * 0.25, padY = r.height * 0.3;   // the glyph, not its line box
          return { l: r.left + padX, r: r.right - padX, t: r.top + padY, b: r.bottom - padY };
        });
      }
      window.addEventListener('resize', measure);
      letters[letters.length - 1].addEventListener('animationend', measure);
      fontsReady.then(measure);
      // Glints are scheduled, so every visitor sees the idea: the first comes about a second
      // after the ball's light comes on, then one every 3-5 s (every 7-9 s while the page is calm).
      // Each time, the letter closest to where the ball's bright light is falling catches it.
      var lightPts = null, lastLetter = -1, glintTimer = 0, started = false, partyOn = false;
      window.addEventListener('disco:light', function (e) {
        lightPts = e.detail.slice();
        if (!started) { started = true; glintTimer = setTimeout(glintTick, 1000); }
      });
      function nearestLetter() {
        var best = -1, bestD = Infinity;
        for (var i = 0; i < letters.length; i++) {
          if (i === lastLetter) continue;
          var b = rects[i], cx = (b.l + b.r) / 2, cy = (b.t + b.b) / 2;
          for (var p = 0; lightPts && p < lightPts.length; p += 2) {
            var dx = lightPts[p] - cx, dy = lightPts[p + 1] - cy, d = dx * dx + dy * dy;
            if (d < bestD) { bestD = d; best = i; }
          }
        }
        if (best < 0) {                                    // no light nearby this moment: any other letter
          best = Math.floor(Math.random() * (letters.length - 1));
          if (best >= lastLetter) best++;
        }
        return best;
      }
      function glintTick() {
        var calm = root.hasAttribute('data-calm');
        if (!partyOn && !reduce.matches && !document.hidden && rects.length) {
          var i = nearestLetter();
          var el = letters[i];
          el.style.removeProperty('--glow');
          el.classList.remove('glint'); void el.offsetWidth; el.classList.add('glint');
          lastLetter = i;
          sparkleBeside(el);
        }
        glintTimer = setTimeout(glintTick, calm ? 7000 + Math.random() * 2000 : 3000 + Math.random() * 2000);
      }
      letters.forEach(function (l) {
        l.addEventListener('animationend', function (e) { if (e.animationName === 'flare') l.classList.remove('glint'); });
      });

      // One or two brand sparkles pop beside the letter that caught the light, then go.
      var SVG = 'http://www.w3.org/2000/svg';
      function sparkleBeside(el) {
        var pr = party.getBoundingClientRect(), r = el.getBoundingClientRect();
        var fs = parseFloat(getComputedStyle(h1).fontSize);
        var n = Math.random() < 0.5 ? 1 : 2;
        for (var k = 0; k < n; k++) {
          var sp = document.createElementNS(SVG, 'svg'), use = document.createElementNS(SVG, 'use');
          use.setAttribute('href', '#bling'); sp.appendChild(use);
          sp.setAttribute('class', 'sp');
          sp.setAttribute('viewBox', '0 0 100 100');
          sp.setAttribute('aria-hidden', 'true');
          var side = (k === 0) === (Math.random() < 0.5) ? -1 : 1;
          var x = (side < 0 ? r.left - r.width * 0.15 : r.right + r.width * 0.15) - pr.left;
          var y = r.top + r.height * (0.15 + Math.random() * 0.25) - pr.top;
          sp.style.left = x + 'px';
          sp.style.top = y + 'px';
          sp.style.setProperty('--s', Math.round(fs * (0.14 + Math.random() * 0.08)) + 'px');
          sp.style.setProperty('--c', k === 0 ? '#FFFFFF' : '#BFA6F2');
          sp.style.setProperty('--delay', (120 + k * 180) + 'ms');
          sp.addEventListener('animationend', function (e) { e.currentTarget.remove(); });
          party.appendChild(sp);
        }
      }

      // ---------- Reading a song's tempo (the same reader as the DJ mixer) ----------
      // How strongly the beats line up when the track is folded at one tempo.
      function fold(env, fps, bpm, bins) {
        var period = fps * 60 / bpm, hist = new Float32Array(bins), stepBy = 1 / period, ph = 0, total = 0, i, b;
        for (i = 0; i < env.length; i++) { hist[(ph * bins) | 0] += env[i]; total += env[i]; ph += stepBy; if (ph >= 1) ph -= 1; }
        var best = 0, at = 0;
        for (b = 0; b < bins; b++) {
          var s = hist[b] + 0.5 * (hist[(b + 1) % bins] + hist[(b + bins - 1) % bins]);
          if (s > best) { best = s; at = b; }
        }
        return { score: total > 0 ? best / total : 0, phase: (at + 0.5) / bins * (60 / bpm) };
      }
      function detectTempo(buffer) {
        var sr = buffer.sampleRate, a = buffer.getChannelData(0);
        var b = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : a;
        var hop = Math.max(1, Math.round(sr / 344)), fps = sr / hop, frames = Math.floor(buffer.length / hop);
        if (frames < fps * 4) return { bpm: 0, firstBeat: 0 };
        // a curve that jumps wherever the sound gets suddenly louder, with extra weight on the bass
        var env = new Float32Array(frames), coef = 1 - Math.exp(-2 * Math.PI * 180 / sr);
        var lp = 0, prevLow = 0, prevFull = 0, any = 0, f, k = 0, i;
        for (f = 0; f < frames; f++) {
          var low = 0, full = 0;
          for (i = 0; i < hop; i++, k++) { var x = (a[k] + b[k]) * 0.5; lp += coef * (x - lp); low += lp * lp; full += x * x; }
          low = Math.sqrt(low / hop); full = Math.sqrt(full / hop);
          var o = Math.max(0, low - prevLow) + 0.5 * Math.max(0, full - prevFull);
          env[f] = o; any += o; prevLow = low; prevFull = full;
        }
        if (any <= 0) return { bpm: 0, firstBeat: 0 };
        // a rough tempo from one minute in the middle of the track
        var segLen = Math.min(frames, Math.floor(fps * 60)), seg0 = Math.floor((frames - segLen) / 2);
        var minLag = Math.floor(fps * 60 / 180), maxLag = Math.ceil(fps * 60 / 70), acf = new Float32Array(maxLag * 2 + 2), lag;

            { root: 55.00, stab: [220.00, 261.63, 329.63, 392.00] }, { root: 73.42, stab: [185.00, 220.00, 261.63, 329.63] },
            { root: 87.31, stab: [174.61, 220.00, 261.63, 329.63] }, { root: 82.41, stab: [207.65, 246.94, 293.66, 329.63] } ],

            { root: 65.41, stab: [155.56, 196.00, 233.08, 261.63] }, { root: 51.91, stab: [155.56, 207.65, 261.63, 311.13] },
            { root: 43.65, stab: [155.56, 174.61, 207.65, 261.63] }, { root: 49.00, stab: [146.83, 196.00, 233.08, 293.66] } ],
            play: function (bar, i, t) {

          // 84 beats a minute: a soft kick, a lazy swing on the hats, long bass notes and an electric piano (Dmaj7, Bm7, Gmaj7, A7sus)

            { root: 73.42, stab: [185.00, 220.00, 277.18, 329.63] }, { root: 61.74, stab: [220.00, 246.94, 293.66, 369.99] },

  <!-- The whole effect. The module injects its own styles and elements.

  <script type="module">

      .catch(function () { window.dispatchEvent(new Event('disco:failed')); });
  </script>
